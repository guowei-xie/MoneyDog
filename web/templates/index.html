<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MoneyDog 量化交易平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 使用 Tailwind CDN 构建现代化 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50">
<div class="min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center justify-center w-8 h-8 rounded bg-emerald-500 text-slate-950 font-bold">M</span>
                <div>
                    <div class="font-semibold text-lg">MoneyDog 量化交易平台</div>
                    <div class="text-xs text-slate-400">本地 DuckDB · 策略回测 · 账户分析</div>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-4 text-xs text-slate-400">
                <span>策略驱动</span>
                <span>分钟级回测</span>
                <span>账户曲线分析</span>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 grid gap-6 lg:grid-cols-3">
        <!-- 左侧：策略与回测配置 -->
        <section class="lg:col-span-1 bg-slate-900/80 rounded-2xl border border-slate-800 shadow-xl shadow-slate-900/40 p-5 space-y-5">
            <h2 class="text-base font-semibold text-slate-50 flex items-center justify-between">
                <span>回测配置</span>
                <span class="text-xs text-emerald-400" id="current-strategy-label"></span>
            </h2>

            <!-- 策略选择 -->
            <div class="space-y-2">
                <div class="text-xs font-medium text-slate-300">策略选择</div>
                <div class="space-y-2">
                    <label class="block">
                        <span class="text-[11px] text-slate-400">策略模块</span>
                        <select id="strategy-module"
                                class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500">
                        </select>
                    </label>
                    <label class="block">
                        <span class="text-[11px] text-slate-400">策略类</span>
                        <select id="strategy-class"
                                class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500">
                        </select>
                    </label>
                </div>
            </div>

            <!-- 回测时间 -->
            <div class="space-y-2">
                <div class="text-xs font-medium text-slate-300">回测时间区间</div>
                <div class="grid grid-cols-2 gap-3">
                    <label class="block">
                        <span class="text-[11px] text-slate-400">开始日期 (YYYYMMDD)</span>
                        <input id="backtest-start" type="text"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="20250101">
                    </label>
                    <label class="block">
                        <span class="text-[11px] text-slate-400">结束日期 (YYYYMMDD)</span>
                        <input id="backtest-end" type="text"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="20250131">
                    </label>
                </div>
            </div>

            <!-- 资金与费用 -->
            <div class="space-y-2">
                <div class="text-xs font-medium text-slate-300">资金与费用</div>
                <div class="grid grid-cols-2 gap-3">
                    <label class="block">
                        <span class="text-[11px] text-slate-400">初始资金</span>
                        <input id="initial-amount" type="number" step="1000"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="1000000">
                    </label>
                    <label class="block">
                        <span class="text-[11px] text-slate-400">手续费率</span>
                        <input id="commission-rate" type="number" step="0.0001"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="0.0001">
                    </label>
                    <label class="block">
                        <span class="text-[11px] text-slate-400">最低佣金</span>
                        <input id="min-commission" type="number" step="1"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="5">
                    </label>
                    <label class="block">
                        <span class="text-[11px] text-slate-400">印花税率</span>
                        <input id="tax-rate" type="number" step="0.0001"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="0.0005">
                    </label>
                </div>
            </div>

            <!-- 仓位控制 -->
            <div class="space-y-2">
                <div class="text-xs font-medium text-slate-300">单股仓位控制</div>
                <div class="grid grid-cols-2 gap-3">
                    <label class="block">
                        <span class="text-[11px] text-slate-400">方式</span>
                        <select id="limit-vol-type"
                                class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500">
                            <option value="ratio">按总资产比例</option>
                            <option value="amount">按固定金额</option>
                        </select>
                    </label>
                    <label class="block">
                        <span class="text-[11px] text-slate-400">max_vol_rate</span>
                        <input id="max-vol-rate" type="number" step="0.01"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="0.05">
                    </label>
                    <label class="block col-span-2">
                        <span class="text-[11px] text-slate-400">max_vol_amount</span>
                        <input id="max-vol-amount" type="number" step="1000"
                               class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                               placeholder="100000">
                    </label>
                </div>
            </div>

            <!-- 多线程选股 -->
            <div class="space-y-2">
                <div class="text-xs font-medium text-slate-300">多线程选股</div>
                <label class="block">
                    <span class="text-[11px] text-slate-400">预选股线程数 (0 = 自动)</span>
                    <input id="batch-threads" type="number" step="1"
                           class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-900/80 px-2 py-1.5 text-sm focus:border-emerald-500 focus:ring-emerald-500"
                           placeholder="0">
                </label>
            </div>

            <!-- 操作按钮与状态 -->
            <div class="pt-2 border-t border-slate-800 flex flex-col gap-3">
                <div class="flex items-center gap-2">
                    <button id="run-backtest-btn"
                            class="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-500 px-3 py-2 text-sm font-semibold text-slate-950 shadow-lg shadow-emerald-500/30 hover:bg-emerald-400 disabled:opacity-60 disabled:cursor-not-allowed">
                        <span id="run-backtest-text">开始回测</span>
                        <span id="run-backtest-spinner" class="hidden">
                            <svg class="animate-spin h-4 w-4 text-slate-950" viewBox="0 0 24 24" fill="none">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                      d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                            </svg>
                        </span>
                    </button>
                    <button id="stop-backtest-btn"
                            class="inline-flex items-center justify-center rounded-xl border border-slate-700 px-3 py-2 text-sm font-semibold text-slate-200 hover:border-red-500 hover:text-red-400 disabled:opacity-40 disabled:cursor-not-allowed"
                            disabled>
                        中止回测
                    </button>
                </div>
                <div id="status-bar" class="text-xs text-slate-400 h-10 leading-relaxed"></div>
                <div class="space-y-1">
                    <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
                        <div id="progress-bar"
                             class="h-full w-0 bg-emerald-500 transition-all duration-300 ease-out"></div>
                    </div>
                    <div id="progress-text" class="text-[11px] text-slate-500"></div>
                </div>
            </div>
        </section>

        <!-- 右侧：结果与历史回测 -->
        <section class="lg:col-span-2 space-y-6">
            <!-- 当前结果卡片 -->
            <div class="bg-slate-900/80 rounded-2xl border border-slate-800 shadow-xl shadow-slate-900/40 p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-semibold text-slate-50">本次回测结果</h2>
                    <span id="current-run-id" class="text-xs text-slate-400"></span>
                </div>
                <!-- 指标网格 -->
                <div id="metrics-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs"></div>

                <!-- 分析摘要 -->
                <div class="mt-3 grid gap-4 md:grid-cols-2 text-xs" id="summary-block">
                    <div>
                        <div class="text-[11px] text-slate-400 mb-1">账户分析结果</div>
                        <pre id="summary-account"
                             class="whitespace-pre-wrap rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-2 text-[11px] text-slate-200 min-h-[3rem]">
暂无账户分析摘要。
                        </pre>
                    </div>
                    <div>
                        <div class="text-[11px] text-slate-400 mb-1">个股分析结果</div>
                        <pre id="summary-stock"
                             class="whitespace-pre-wrap rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-2 text-[11px] text-slate-200 min-h-[3rem]">
暂无个股分析摘要。
                        </pre>
                    </div>
                </div>
                <!-- 账户曲线 -->
                <div class="mt-4 border border-slate-800 rounded-xl overflow-hidden bg-slate-950/60">
                    <div class="px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
                        <span>账户收益与仓位曲线</span>
                        <span id="curve-hint" class="hidden">如图片未加载，请检查 results 目录</span>
                    </div>
                    <div class="p-0">
                        <div class="relative w-full overflow-hidden">
                            <img id="account-curve-img" alt="账户收益曲线"
                                 class="block w-full h-auto max-h-[420px] object-contain bg-slate-900/80 hidden">
                        </div>
                        <div id="curve-placeholder"
                             class="w-full h-40 flex items-center justify-center text-xs text-slate-500 border-t border-slate-800/80">
                            暂无回测结果，请先在左侧配置并运行一次回测。
                        </div>
                    </div>
                </div>
            </div>

            <!-- 历史回测列表 -->
            <div class="bg-slate-900/80 rounded-2xl border border-slate-800 shadow-xl shadow-slate-900/40 p-5 space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-semibold text-slate-50">历史回测</h2>
                    <button id="refresh-runs-btn"
                            class="inline-flex items-center gap-1 rounded-lg border border-slate-700 px-2 py-1 text-xs text-slate-300 hover:border-emerald-500 hover:text-emerald-400">
                        刷新
                    </button>
                </div>
                <div class="overflow-x-auto text-xs">
                    <table class="min-w-full border-separate border-spacing-y-1">
                        <thead class="text-slate-400">
                        <tr>
                            <th class="text-left font-medium px-2 py-1.5">回测 ID</th>
                            <th class="text-left font-medium px-2 py-1.5">策略</th>
                            <th class="text-left font-medium px-2 py-1.5">区间</th>
                            <th class="text-right font-medium px-2 py-1.5">总收益%</th>
                            <th class="text-right font-medium px-2 py-1.5">最大回撤%</th>
                            <th class="text-right font-medium px-2 py-1.5">夏普</th>
                            <th class="text-right font-medium px-2 py-1.5">操作</th>
                        </tr>
                        </thead>
                        <tbody id="runs-tbody">
                        <!-- 通过 JS 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- 策略代码查看弹窗 -->
<div id="code-modal"
     class="fixed inset-0 z-30 hidden items-center justify-center bg-slate-950/70">
    <div class="w-full max-w-3xl max-h-[80vh] bg-slate-900 border border-slate-700 rounded-2xl shadow-xl flex flex-col">
        <div class="px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
            <div id="code-modal-title" class="font-semibold text-slate-100 text-sm"></div>
            <button id="code-modal-close"
                    class="text-slate-400 hover:text-slate-100 text-xs px-2 py-1 rounded-lg border border-transparent hover:border-slate-600">
                关闭
            </button>
        </div>
        <div class="p-3 overflow-auto text-[11px]">
            <pre id="code-modal-content"
                 class="whitespace-pre text-slate-100 font-mono"></pre>
        </div>
    </div>
</div>

<script>
    // 简单工具函数：设置状态栏信息
    function setStatus(message, type = "info") {
        const el = document.getElementById("status-bar");
        if (!el) return;
        if (!message) {
            el.textContent = "";
            return;
        }
        const color = type === "error" ? "text-red-400" : type === "success" ? "text-emerald-400" : "text-slate-400";
        el.className = "text-xs h-10 leading-relaxed " + color;
        el.textContent = message;
    }

    let isRunning = false;
    let statusTimer = null;
    let lastProgressPercent = 0;
    let lastProgressStage = "idle";

    // 设置回测运行状态（控制开始/中止按钮与 Loading）
    function setRunningState(running) {
        isRunning = running;
        const runBtn = document.getElementById("run-backtest-btn");
        const stopBtn = document.getElementById("stop-backtest-btn");
        const text = document.getElementById("run-backtest-text");
        const spinner = document.getElementById("run-backtest-spinner");
        if (!runBtn || !stopBtn || !text || !spinner) return;

        if (running) {
            runBtn.disabled = true;
            stopBtn.disabled = false;
            spinner.classList.remove("hidden");
            text.textContent = "回测运行中...";
        } else {
            runBtn.disabled = false;
            stopBtn.disabled = true;
            spinner.classList.add("hidden");
            text.textContent = "开始回测";
        }
    }

    /**
     * 更新进度条与进度文案。
     *
     * @param {string} stage   阶段标识（selection/backtest/idle）
     * @param {number} percent 进度百分比（0-100）
     * @param {number} current 已完成交易日数
     * @param {number} total   总交易日数
     */
    function updateProgress(stage, percent, current, total) {
        const bar = document.getElementById("progress-bar");
        const text = document.getElementById("progress-text");
        if (!bar || !text) return;

        const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
        lastProgressPercent = safePercent;
        lastProgressStage = stage || "idle";
        bar.style.width = `${safePercent}%`;

        if (!stage || stage === "idle") {
            text.textContent = "";
            return;
        }

        const isSelection = stage === "selection";
        const label = isSelection ? "选股进度" : "回测进度";

        if (!total) {
            text.textContent = safePercent > 0
                ? `${label}：准备中... ${safePercent.toFixed(1)}%`
                : "";
            return;
        }
        text.textContent = `${label}：${current}/${total} 日 (${safePercent.toFixed(1)}%)`;
    }

    // 启动/停止轮询后端运行状态
    function startStatusPolling() {
        if (statusTimer) {
            clearInterval(statusTimer);
        }
        statusTimer = setInterval(checkBacktestStatus, 5000);
    }

    function stopStatusPolling() {
        if (statusTimer) {
            clearInterval(statusTimer);
            statusTimer = null;
        }
    }

    // 渲染指标卡片
    function renderMetrics(metrics) {
        const grid = document.getElementById("metrics-grid");
        if (!grid) return;
        grid.innerHTML = "";
        if (!metrics || Object.keys(metrics).length === 0) {
            grid.innerHTML = '<div class="text-xs text-slate-500">暂无账户指标。</div>';
            return;
        }

        const items = [
            {key: "profit_rate", label: "总收益率", fmt: v => (v * 100).toFixed(2) + "%"},
            {key: "max_drawdown", label: "最大回撤", fmt: v => (v * 100).toFixed(2) + "%"},
            {key: "sharpe_ratio", label: "夏普比率", fmt: v => (v ?? 0).toFixed(2)},
            {key: "max_profit_rate", label: "最大涨幅", fmt: v => (v * 100).toFixed(2) + "%"},
            {key: "max_loss_rate", label: "最大跌幅", fmt: v => (v * 100).toFixed(2) + "%"},
            {key: "max_stock_count", label: "最大持仓数", fmt: v => String(v)},
            {key: "max_position_rate", label: "最大仓位", fmt: v => (v * 100).toFixed(2) + "%"},
            {key: "empty_days", label: "空仓天数", fmt: v => String(v)},
        ];

        for (const item of items) {
            const val = metrics[item.key];
            if (val === undefined || val === null || Number.isNaN(val)) continue;
            const card = document.createElement("div");
            card.className = "rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 flex flex-col gap-1";
            const label = document.createElement("div");
            label.className = "text-[11px] text-slate-400";
            label.textContent = item.label;
            const value = document.createElement("div");
            value.className = "text-sm font-semibold text-slate-50";
            value.textContent = item.fmt(val);
            card.appendChild(label);
            card.appendChild(value);
            grid.appendChild(card);
        }
    }

    // 渲染账户曲线
    function renderCurve(runId, hasCurve) {
        const img = document.getElementById("account-curve-img");
        const placeholder = document.getElementById("curve-placeholder");
        const hint = document.getElementById("curve-hint");
        if (!img || !placeholder || !hint) return;
        if (!runId || !hasCurve) {
            img.classList.add("hidden");
            placeholder.classList.remove("hidden");
            return;
        }
        const ts = Date.now();
        img.src = `/api/backtests/${encodeURIComponent(runId)}/curve?ts=${ts}`;
        img.onload = () => {
            img.classList.remove("hidden");
            placeholder.classList.add("hidden");
            hint.classList.add("hidden");
        };
        img.onerror = () => {
            img.classList.add("hidden");
            placeholder.classList.remove("hidden");
            hint.classList.remove("hidden");
        };
    }

    // 渲染分析摘要
    function renderSummary(summary) {
        const accountEl = document.getElementById("summary-account");
        const stockEl = document.getElementById("summary-stock");
        if (!accountEl || !stockEl) return;

        const emptyAccount = "暂无账户分析摘要。";
        const emptyStock = "暂无个股分析摘要。";

        if (!summary) {
            accountEl.textContent = emptyAccount;
            stockEl.textContent = emptyStock;
            return;
        }

        const accountLines = Array.isArray(summary.account) ? summary.account : [];
        const stockLines = Array.isArray(summary.stock) ? summary.stock : [];

        accountEl.textContent = accountLines.length ? accountLines.join("\n") : emptyAccount;
        stockEl.textContent = stockLines.length ? stockLines.join("\n") : emptyStock;
    }

    // 渲染历史回测表格
    function renderRunsTable(runs) {
        const tbody = document.getElementById("runs-tbody");
        if (!tbody) return;
        tbody.innerHTML = "";
        if (!runs || runs.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.colSpan = 7;
            cell.className = "px-2 py-2 text-center text-slate-500";
            cell.textContent = "暂无历史回测记录。";
            row.appendChild(cell);
            tbody.appendChild(row);
            return;
        }
        for (const run of runs.slice().reverse()) {
            const tr = document.createElement("tr");
            tr.className = "bg-slate-900/80 hover:bg-slate-800/80 cursor-pointer";

            const strategyLabel = `${run.strategy.strategy_class}`;
            const period = `${run.backtest.backtest_start_time}-${run.backtest.backtest_end_time}`;
            const m = run.metrics || {};
            const s = run.summary || null;

            const cells = [
                {text: run.id, align: "text-left"},
                {text: strategyLabel, align: "text-left"},
                {text: period, align: "text-left"},
                {text: m.profit_rate != null ? (m.profit_rate * 100).toFixed(2) : "-", align: "text-right"},
                {text: m.max_drawdown != null ? (m.max_drawdown * 100).toFixed(2) : "-", align: "text-right"},
                {text: m.sharpe_ratio != null ? m.sharpe_ratio.toFixed(2) : "-", align: "text-right"},
            ];

            for (const cellInfo of cells) {
                const td = document.createElement("td");
                td.className = `${cellInfo.align} px-2 py-1.5 text-slate-200`;
                td.textContent = cellInfo.text;
                tr.appendChild(td);
            }

            // 点击整行即视为“查看”
            tr.onclick = () => {
                document.getElementById("current-run-id").textContent = `当前回测：${run.id}`;
                renderMetrics(m);
                renderCurve(run.id, !!run.files.account_curve);
                renderSummary(s);
            };

            const actionTd = document.createElement("td");
            actionTd.className = "text-right px-2 py-1.5 space-x-1";

            const codeBtn = document.createElement("button");
            codeBtn.className = "inline-flex items-center rounded-lg border border-slate-700 px-2 py-0.5 text-xs text-slate-200 hover:border-emerald-500 hover:text-emerald-400";
            codeBtn.textContent = "代码";
            codeBtn.onclick = async (e) => {
                e.stopPropagation();
                try {
                    const data = await fetchJson(`/api/backtests/${encodeURIComponent(run.id)}/code`);
                    openCodeModal(run, data);
                } catch (err) {
                    console.error(err);
                    setStatus("加载策略代码失败，请检查服务器日志或结果目录。", "error");
                }
            };

            const recordBtn = document.createElement("button");
            recordBtn.className = "inline-flex items-center rounded-lg border border-slate-700 px-2 py-0.5 text-xs text-slate-200 hover:border-emerald-500 hover:text-emerald-400";
            recordBtn.textContent = "记录";
            recordBtn.onclick = (e) => {
                e.stopPropagation();
                window.open(`/api/backtests/${encodeURIComponent(run.id)}/record`, "_blank");
            };

            const delBtn = document.createElement("button");
            delBtn.className = "inline-flex items-center rounded-lg border border-slate-800 px-2 py-0.5 text-xs text-slate-300 hover:border-red-500 hover:text-red-400";
            delBtn.textContent = "删除";
            delBtn.onclick = async (e) => {
                e.stopPropagation();
                if (!confirm(`确定删除回测记录 ${run.id} 吗？（仅删除记录，不会删除结果文件）`)) {
                    return;
                }
                try {
                    await fetchJson(`/api/backtests/${encodeURIComponent(run.id)}`, {
                        method: "DELETE",
                    });
                    // 如当前展示的是被删记录，则清空右侧展示
                    const currentLabel = document.getElementById("current-run-id");
                    if (currentLabel && currentLabel.textContent.includes(run.id)) {
                        currentLabel.textContent = "";
                        renderMetrics({});
                        renderCurve(null, false);
                        renderSummary(null);
                    }
                    await loadRuns();
                    setStatus(`已删除回测记录：${run.id}`, "success");
                } catch (e) {
                    console.error(e);
                    setStatus("删除回测记录失败。", "error");
                }
            };

            actionTd.appendChild(codeBtn);
            actionTd.appendChild(recordBtn);
            actionTd.appendChild(delBtn);
            tr.appendChild(actionTd);

            tbody.appendChild(tr);
        }
    }

    function openCodeModal(run, data) {
        const modal = document.getElementById("code-modal");
        const titleEl = document.getElementById("code-modal-title");
        const contentEl = document.getElementById("code-modal-content");
        if (!modal || !titleEl || !contentEl) return;

        const moduleName = run.strategy?.strategy_module || "";
        const className = run.strategy?.strategy_class || "";
        const fileName = data?.file_name || "";
        const code = data?.code || "暂无策略代码内容。";

        const strategyLabel = moduleName && className
            ? `${moduleName}.${className}`
            : className || moduleName || "未识别策略";

        titleEl.textContent = `策略代码：${strategyLabel}${fileName ? ` (${fileName})` : ""}`;
        contentEl.textContent = code;

        modal.classList.remove("hidden");
        modal.classList.add("flex");
    }

    function closeCodeModal() {
        const modal = document.getElementById("code-modal");
        if (!modal) return;
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }

    async function fetchJson(url, options) {
        const resp = await fetch(url, options);
        if (!resp.ok) {
            const text = await resp.text();
            throw new Error(text || `HTTP ${resp.status}`);
        }
        return resp.json();
    }

    async function loadStrategiesAndConfig() {
        try {
            const [strategies, config] = await Promise.all([
                fetchJson("/api/strategies"),
                fetchJson("/api/config"),
            ]);

            const moduleSelect = document.getElementById("strategy-module");
            const classSelect = document.getElementById("strategy-class");
            if (!moduleSelect || !classSelect) return;

            moduleSelect.innerHTML = "";
            classSelect.innerHTML = "";

            let currentModule = config.strategy.strategy_module;
            let currentClass = config.strategy.strategy_class;

            for (const item of strategies) {
                const opt = document.createElement("option");
                opt.value = item.module;
                opt.textContent = item.module;
                if (item.module === currentModule) {
                    opt.selected = true;
                    classSelect.innerHTML = "";
                    for (const cls of item.classes) {
                        const clsOpt = document.createElement("option");
                        clsOpt.value = cls;
                        clsOpt.textContent = cls;
                        if (cls === currentClass) {
                            clsOpt.selected = true;
                        }
                        classSelect.appendChild(clsOpt);
                    }
                }
                moduleSelect.appendChild(opt);
            }

            moduleSelect.onchange = () => {
                const moduleName = moduleSelect.value;
                const item = strategies.find(s => s.module === moduleName);
                classSelect.innerHTML = "";
                if (!item) return;
                for (const cls of item.classes) {
                    const clsOpt = document.createElement("option");
                    clsOpt.value = cls;
                    clsOpt.textContent = cls;
                    classSelect.appendChild(clsOpt);
                }
            };

            document.getElementById("current-strategy-label").textContent =
                `当前：${currentModule || "未配置"}.${currentClass || ""}`;

            // 填充回测配置
            const bt = config.backtest;
            document.getElementById("backtest-start").value = bt.backtest_start_time || "";
            document.getElementById("backtest-end").value = bt.backtest_end_time || "";
            document.getElementById("initial-amount").value = bt.initial_amount ?? "";
            document.getElementById("commission-rate").value = bt.commission_rate ?? "";
            document.getElementById("min-commission").value = bt.min_commission ?? "";
            document.getElementById("tax-rate").value = bt.tax_rate ?? "";
            document.getElementById("limit-vol-type").value = bt.limit_vol_type || "amount";
            document.getElementById("max-vol-rate").value = bt.max_vol_rate ?? "";
            document.getElementById("max-vol-amount").value = bt.max_vol_amount ?? "";
            document.getElementById("batch-threads").value = bt.batch_stock_selection_threads ?? 0;

            setStatus("配置已加载。");
        } catch (e) {
            console.error(e);
            setStatus("加载策略或配置失败，请检查服务器日志。", "error");
        }
    }

    async function loadRuns() {
        try {
            const runs = await fetchJson("/api/backtests");
            renderRunsTable(runs);
        } catch (e) {
            console.error(e);
            setStatus("加载历史回测失败。", "error");
        }
    }

    async function handleRunBacktest() {
        try {
            setRunningState(true);
            setStatus("回测任务已提交，正在后台执行，可随时中止。");
            updateProgress("selection", 0, 0, 0);
            startStatusPolling();

            const strategyModule = document.getElementById("strategy-module").value;
            const strategyClass = document.getElementById("strategy-class").value;

            const payload = {
                strategy: {
                    strategy_module: strategyModule,
                    strategy_class: strategyClass,
                },
                backtest: {
                    backtest_start_time: document.getElementById("backtest-start").value.trim(),
                    backtest_end_time: document.getElementById("backtest-end").value.trim(),
                    initial_amount: Number(document.getElementById("initial-amount").value),
                    commission_rate: Number(document.getElementById("commission-rate").value),
                    min_commission: Number(document.getElementById("min-commission").value),
                    tax_rate: Number(document.getElementById("tax-rate").value),
                    limit_vol_type: document.getElementById("limit-vol-type").value,
                    max_vol_rate: Number(document.getElementById("max-vol-rate").value),
                    max_vol_amount: Number(document.getElementById("max-vol-amount").value),
                    batch_stock_selection_threads: Number(document.getElementById("batch-threads").value),
                },
            };

            const resp = await fetchJson("/api/backtests/run", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload),
            });

            const runId = resp.run_id;
            document.getElementById("current-run-id").textContent = `当前回测：${runId}`;
            // 后端在后台线程中执行回测，当前接口只返回 run_id
            setStatus(`回测已启动，ID=${runId}，完成后可在历史回测与右侧结果中查看。`, "info");
        } catch (e) {
            console.error(e);
            setStatus("回测执行失败，请查看日志。", "error");
            setRunningState(false);
            stopStatusPolling();
        }
    }

    async function handleStopBacktest() {
        if (!isRunning) return;
        try {
            const resp = await fetchJson("/api/backtests/stop", {
                method: "POST",
            });
            setRunningState(false);
            stopStatusPolling();
            setStatus(`已请求中止当前回测（run_id=${resp.run_id}），会在当前交易日结束后停止。`, "info");
            updateProgress(lastProgressStage, lastProgressPercent, 0, 0);
        } catch (e) {
            console.error(e);
            setStatus("中止回测失败，请检查服务器日志。", "error");
        }
    }

    async function checkBacktestStatus() {
        if (!isRunning) {
            stopStatusPolling();
            return;
        }
        try {
            const resp = await fetchJson("/api/backtests/status");
            if (resp && typeof resp.percent === "number") {
                updateProgress(resp.stage || "backtest", resp.percent, resp.current || 0, resp.total || 0);
                if (resp.percent >= 100 && resp.running) {
                    const stageLabel = (resp.stage === "selection") ? "选股" : "回测";
                    setStatus(`${stageLabel}结果正在整理，请稍候...`, "info");
                }
            }
            if (!resp.running) {
                setRunningState(false);
                stopStatusPolling();
                updateProgress(resp.stage || "backtest", 100, resp.total || 0, resp.total || 0);
                setStatus("当前回测已结束，可在右侧查看结果并再次运行。", "info");
                await loadRuns();
            }
        } catch (e) {
            console.error(e);
            // 状态查询失败不立刻关闭轮询，但避免刷屏提示
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        document.getElementById("run-backtest-btn").addEventListener("click", handleRunBacktest);
        document.getElementById("stop-backtest-btn").addEventListener("click", handleStopBacktest);
        document.getElementById("refresh-runs-btn").addEventListener("click", loadRuns);
        const codeModal = document.getElementById("code-modal");
        const codeModalClose = document.getElementById("code-modal-close");
        if (codeModal) {
            codeModal.addEventListener("click", (e) => {
                if (e.target === codeModal) {
                    closeCodeModal();
                }
            });
        }
        if (codeModalClose) {
            codeModalClose.addEventListener("click", (e) => {
                e.stopPropagation();
                closeCodeModal();
            });
        }
        loadStrategiesAndConfig();
        loadRuns();
    });
</script>
</body>
</html>
