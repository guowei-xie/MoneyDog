[LOGGING]
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO

# 数据配置（新库：stock_1day_bars / stock_1m_bars / index_1day_bars，时间戳为秒）
[DATA]
data_path = /Users/xgw/workspace/Python/MoneyDog_db/data/moneydog.duckdb

# 策略配置
[STRATEGY]
# 策略模块名（策略文件名，不含.py后缀，例如：N_Pattern_Bottom、BuyOnDips）
strategy_module = N_Pattern_Bottom
# 策略类名（策略类名称，例如：NPatternBottom、BuyOnDips）
strategy_class = NPatternBottom

# 策略回测配置
[BACKTEST]
# 冗余日志开关:
# - verbose = False: 简约模式（显示回测/选股进度条，不显示部分冗余信息日志）
# - verbose = True : 冗余模式（显示部分冗余信息日志，不显示回测/选股进度条）
verbose = False
# 回测开始时间
backtest_start_time = 20250901
# 回测结束时间
backtest_end_time = 20250930
# 初始资金
initial_amount = 1000000 
# 手续费率（双向收取）
commission_rate = 0.0001
# 最低佣金（双向收取）
min_commission = 5
# 印花税（卖出收取）
tax_rate = 0.0005
# 限制单股买入仓位方式选择(比例:"ratio"/金额:"amount")
limit_vol_type = amount
# 单股买入最大仓位比例，当limit_vol_type为ratio时生效
max_vol_rate = 0.05
# 单股买入最大仓位金额，当limit_vol_type为amount时生效
max_vol_amount = 100000
# 选股是否使用多线程：True=多线程（生产），False=单线程（便于开发调试）
batch_stock_selection_use_threads = True
# 多线程选股时的线程数（仅当 batch_stock_selection_use_threads=True 时生效，0=自动）
batch_stock_selection_threads = 0